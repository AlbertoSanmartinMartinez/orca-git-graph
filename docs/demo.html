<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Git Graph</title>
<style>
:root{color-scheme:dark;--bg:#181818;--fg:#ddd;--line:#343434;--dim:#929292;--selected:#203953}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--fg);font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column}
header{padding:12px 12px 8px;border-bottom:1px solid var(--line);flex:none}h1{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between}.readonly{color:var(--dim);font-size:11px;font-weight:400}.controls{display:flex;gap:6px;margin-top:7px}select,input,button{background:#252526;border:1px solid #454545;color:var(--fg);border-radius:4px;padding:6px;font:inherit;min-width:0}select{width:100%}input{flex:1}button{cursor:pointer}button:hover{background:#383838}button:focus-visible,select:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid #389bea;outline-offset:-2px}#status,#updated{color:var(--dim);font-size:11px;margin-top:7px;line-height:1.6}#status{color:#c8d6df}#viewport{overflow:auto;flex:1;min-height:100px;position:relative}.table{min-width:650px}.columns,.row{display:grid;grid-template-columns:var(--gw) minmax(230px,1fr) 72px 95px 86px;align-items:center}.columns{height:29px;background:#202020;position:sticky;top:0;z-index:3;border-bottom:1px solid #454545;font-weight:600}.columns>span{padding:0 8px;overflow:hidden}.rows{position:relative}#graph{position:absolute;left:0;top:0;pointer-events:none;z-index:2}.row{height:30px;cursor:pointer;white-space:nowrap}.row:hover{background:#262626}.row.selected{background:var(--selected)}.row.dimmed{opacity:.3}.row.match .subject{color:#ffdc83}.row>span{padding:0 8px;overflow:hidden;text-overflow:ellipsis}.row .subject{display:flex;align-items:center;gap:5px;padding-left:2px}.message{overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;flex-shrink:0;max-width:250px;overflow:hidden;text-overflow:ellipsis;border:1px solid #696969;border-radius:4px;padding:1px 5px;font-size:11px;background:#262626}.badge.head{border-color:#83d481;color:#b4f0a3}.badge.tag{border-color:#d7b568;color:#e9d59a}.badge.remote{color:#b3d7ef}.hash{font-family:ui-monospace,SFMono-Regular,monospace}.date,.author{color:#aaa}#detail{flex:none;max-height:40%;overflow:auto;background:#1d1d1d;border-top:1px solid #4a4a4a;padding:12px;line-height:1.6}#detail[hidden]{display:none}#detail h2{font-size:13px;margin:0 30px 7px 0}#close{float:right;padding:0 7px;font-size:18px}#detail pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:12px;line-height:1.6}#detail .meta{overflow-wrap:anywhere;color:#aaa}#files{list-style:none;padding:0;margin:8px 0}#files li{overflow-wrap:anywhere;border-top:1px solid #303030;padding:3px 0}#files b{color:#8cc48e;display:inline-block;min-width:28px}footer{border-top:1px solid var(--line);padding:5px 12px;color:var(--dim);font-size:10px;flex:none}#empty{padding:28px;color:var(--dim)}
@media(prefers-color-scheme:light){html.light{--bg:#fff;--fg:#252525;--line:#ddd;--dim:#666;--selected:#e1effb}html.light select,html.light input,html.light button,html.light .badge{background:#f5f5f5;color:#333}html.light .columns,html.light #detail{background:#f3f3f3}html.light .row:hover{background:#eee}}
</style></head><body>
<header><h1><span>⑂ Git Graph</span><span class="readonly">Fictional interactive demo</span></h1>
<select id="repo" aria-label="Repository"></select><div class="controls"><select id="branch" aria-label="Branch" style="flex:1"></select></div>
<div class="controls"><input id="search" type="search" placeholder="Search message, author, or hash" aria-label="Search commits"><button id="next" title="Next search result">Next</button><button id="head" title="Go to the checked-out commit">HEAD</button></div>
<div id="status"></div><div id="updated"></div></header>
<div id="viewport" tabindex="0" aria-label="Commit graph"><div class="table"><div class="columns"><span>Graph</span><span>Description</span><span>Date</span><span>Author</span><span>Commit</span></div><div class="rows" id="rows"></div></div></div>
<section id="detail" aria-label="Commit details" hidden><button id="close" aria-label="Close details">×</button><h2 id="title"></h2><div class="meta" id="meta"></div><pre id="body"></pre><ul id="files"></ul></section>
<footer id="footer"></footer>
<script>
'use strict';
const DATA={"generated": "2026-09-15T12:00:00+00:00", "limit": 400, "repos": [{"path": "/example/acme-app", "name": "acme-app", "commits": [{"hash": "84da781262cf59934820a13b46c16ef552dff97d", "parents": ["5eafbccd1f485d026716d3b52101666c7a544b09"], "an": "Alex Example", "ae": "alex@example.com", "at": 1789473600, "ct": 1789473600, "subject": "Keep Git history beside the conversation", "message": "Keep Git history beside the conversation", "refs": [{"name": "feature/sidebar", "type": "head"}], "files": [{"status": "A", "path": "panel.html"}]}, {"hash": "5eafbccd1f485d026716d3b52101666c7a544b09", "parents": ["5f566d542ba92c0598e2380e16a8d08934e1edb5"], "an": "Alex Example", "ae": "alex@example.com", "at": 1789387200, "ct": 1789387200, "subject": "Show branches, tags, and author details", "message": "Show branches, tags, and author details", "refs": [{"name": "main", "type": "branch"}, {"name": "origin/main", "type": "remote"}], "files": [{"status": "A", "path": "graph.js"}]}, {"hash": "5f566d542ba92c0598e2380e16a8d08934e1edb5", "parents": ["4c07a0d833f542343fc7ed29af2d1aa34fe83ec4", "6212069647042be1b91fdf29385ae76fd8a14090"], "an": "Alex Example", "ae": "alex@example.com", "at": 1789300800, "ct": 1789300800, "subject": "Merge branch feature/search", "message": "Merge branch feature/search", "refs": [{"name": "v0.1.0", "type": "tag"}], "files": []}, {"hash": "6212069647042be1b91fdf29385ae76fd8a14090", "parents": ["b41d91c168bd491710dbc37159292500fb25b002"], "an": "Alex Example", "ae": "alex@example.com", "at": 1789214400, "ct": 1789214400, "subject": "Highlight matching authors and commit hashes", "message": "Highlight matching authors and commit hashes", "refs": [{"name": "feature/search", "type": "branch"}], "files": [{"status": "A", "path": "highlight.js"}]}, {"hash": "b41d91c168bd491710dbc37159292500fb25b002", "parents": ["3ce35c7493d4d635322e1b05ebb53f790ae704f0"], "an": "Alex Example", "ae": "alex@example.com", "at": 1789128000, "ct": 1789128000, "subject": "Add commit search and keyboard navigation", "message": "Add commit search and keyboard navigation", "refs": [], "files": [{"status": "A", "path": "search.js"}]}, {"hash": "eadf83c2b58ad7fb7f36962f3ead9e83ea59408f", "parents": ["4c07a0d833f542343fc7ed29af2d1aa34fe83ec4"], "an": "Alex Example", "ae": "alex@example.com", "at": 1789041600, "ct": 1789041600, "subject": "Follow the exact active Git worktree", "message": "Follow the exact active Git worktree", "refs": [{"name": "fix/worktree-switching", "type": "branch"}], "files": [{"status": "A", "path": "workspace.py"}]}, {"hash": "4c07a0d833f542343fc7ed29af2d1aa34fe83ec4", "parents": ["3ce35c7493d4d635322e1b05ebb53f790ae704f0"], "an": "Alex Example", "ae": "alex@example.com", "at": 1788955200, "ct": 1788955200, "subject": "Document the one-time plugin setup", "message": "Document the one-time plugin setup", "refs": [], "files": [{"status": "A", "path": "installation.md"}]}, {"hash": "3ce35c7493d4d635322e1b05ebb53f790ae704f0", "parents": [], "an": "Alex Example", "ae": "alex@example.com", "at": 1788868800, "ct": 1788868800, "subject": "Initialize the example application", "message": "Initialize the example application", "refs": [], "files": [{"status": "A", "path": "README.md"}]}], "head": "84da781262cf59934820a13b46c16ef552dff97d", "branch": "feature/sidebar", "refs": [{"name": "feature/search", "hash": "6212069647042be1b91fdf29385ae76fd8a14090"}, {"name": "feature/sidebar", "hash": "84da781262cf59934820a13b46c16ef552dff97d"}, {"name": "fix/worktree-switching", "hash": "eadf83c2b58ad7fb7f36962f3ead9e83ea59408f"}, {"name": "main", "hash": "5eafbccd1f485d026716d3b52101666c7a544b09"}, {"name": "origin/main", "hash": "5eafbccd1f485d026716d3b52101666c7a544b09"}, {"name": "v0.1.0", "hash": "5f566d542ba92c0598e2380e16a8d08934e1edb5"}], "upstream": null, "ahead": 0, "behind": 0}], "followWorkspace": true};
const $=s=>document.querySelector(s),colors=['#00a7e8','#e200a5','#36d216','#d48a05','#ae24f2','#ef5146','#15c7b4','#ccbd34'];
let repo=DATA.repos[0],visible=[],selected=null,matches=[],matchIndex=-1;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function layout(commits){const lanes=[];let max=1;return {commits:commits.map(source=>{const c={...source},before=[...lanes],waiting=[];lanes.forEach((h,i)=>{if(h===c.hash)waiting.push(i)});let lane=waiting.length?waiting[0]:lanes.indexOf(null);if(lane<0)lane=lanes.length;waiting.slice(1).forEach(i=>lanes[i]=null);c.lane=lane;c.mergedFrom=waiting.slice(1);lanes[lane]=c.parents[0]||null;c.parentLanes=c.parents.slice(1).map(p=>{let i=lanes.indexOf(p);if(i<0){i=lanes.indexOf(null);if(i<0)i=lanes.length;lanes[i]=p}return i});c.firstParentLane=c.parents.length?lane:null;const busy=new Set([lane,...waiting,...c.parentLanes]);c.through=lanes.map((_,i)=>i).filter(i=>!busy.has(i)&&before[i]&&lanes[i]);c.hasParentAbove=Boolean(before[lane]);max=Math.max(max,lanes.length);return c}),get lanes(){return max}}}
function chooseRepo(){repo=DATA.repos[Number($('#repo').value)];$('#branch').innerHTML='<option value="all">All branches and tags</option><option value="head">Current HEAD</option>'+repo.refs.map(r=>`<option value="${esc(r.hash)}">${esc(r.name)}</option>`).join('');$('#status').textContent=repo.error||`${repo.branch}${repo.upstream?' → '+repo.upstream:''}  ↑${repo.ahead} ↓${repo.behind}`;$('#status').title=repo.path;$('#repo').title=repo.path;$('#repo').disabled=Boolean(DATA.followWorkspace);$('#search').value='';selected=null;$('#detail').hidden=true;render()}
function render(){let list=repo.commits;const branch=$('#branch').value;if(branch!=='all'){const seen=new Set(),todo=[branch==='head'?repo.head:branch],lookup=new Map(list.map(c=>[c.hash,c]));while(todo.length){const h=todo.pop();if(seen.has(h))continue;seen.add(h);const c=lookup.get(h);if(c)todo.push(...c.parents)}list=list.filter(c=>seen.has(c.hash))}const graph=layout(list);visible=graph.commits;const width=Math.max(62,graph.lanes*16+24);document.documentElement.style.setProperty('--gw',width+'px');$('#rows').innerHTML=visible.map((c,i)=>`<div class="row" tabindex="0" data-index="${i}" role="button" aria-label="${esc(c.hash.slice(0,8)+' '+c.subject)}"><span></span><span class="subject">${c.refs.map(r=>`<span class="badge ${r.type}" title="${esc(r.name)}">${esc(r.type==='head'?'HEAD → ':'')}${esc(r.name)}</span>`).join('')}<span class="message" title="${esc(c.subject)}">${esc(c.subject)}</span></span><span class="date" title="${esc(new Date(c.ct*1000).toLocaleString())}">${new Date(c.ct*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span><span class="author" title="${esc(c.an)}">${esc(c.an)}</span><span class="hash">${c.hash.slice(0,8)}</span></div>`).join('')+(visible.length?'':`<div id="empty">${esc(repo.error||'No commits in this range.')}</div>`);draw(width);$('#rows').querySelectorAll('.row').forEach(row=>{row.onclick=()=>pick(Number(row.dataset.index));row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(Number(row.dataset.index))}}});$('#footer').textContent=`${visible.length} commits · Up to ${DATA.limit} per repository · Scroll horizontally for more`;search(false)}
function draw(width){const x=l=>16+l*16,col=l=>colors[l%colors.length];let paths='',dots='';const path=(d,c)=>paths+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="1.8"/>`;visible.forEach((c,i)=>{const t=i*30,b=t+30,y=t+15,cx=x(c.lane);c.through.forEach(l=>path(`M${x(l)} ${t}V${b}`,col(l)));if(c.hasParentAbove)path(`M${cx} ${t}V${y}`,col(c.lane));if(c.firstParentLane!==null)path(`M${cx} ${y}V${b}`,col(c.lane));c.mergedFrom.forEach(l=>path(`M${x(l)} ${t}C${x(l)} ${t+8} ${cx} ${t+8} ${cx} ${y}`,col(l)));c.parentLanes.forEach(l=>path(`M${cx} ${y}C${cx} ${y+8} ${x(l)} ${y+8} ${x(l)} ${b}`,col(l)));const head=c.hash===repo.head;dots+=`<circle cx="${cx}" cy="${y}" r="${head?4.8:3.3}" fill="${head?'#fff':col(c.lane)}" stroke="${col(c.lane)}" stroke-width="1.8"/>`});$('#rows').insertAdjacentHTML('afterbegin',`<svg id="graph" width="${width}" height="${visible.length*30}" aria-hidden="true">${paths}${dots}</svg>`)}
function pick(i){const c=visible[i];if(!c)return;selected=i;document.querySelectorAll('.row').forEach(r=>r.classList.toggle('selected',Number(r.dataset.index)===i));$('#detail').hidden=false;$('#title').textContent=c.subject;$('#meta').textContent=`${c.hash}\n${c.an} <${c.ae}> · ${new Date(c.ct*1000).toLocaleString()}\nParents: ${c.parents.map(h=>h.slice(0,8)).join(', ')||'None'}`;$('#meta').style.whiteSpace='pre-wrap';$('#body').textContent=c.message||c.subject;$('#files').innerHTML=(c.files||[]).map(f=>`<li><b>${esc(f.status)}</b>${esc(f.oldPath?f.oldPath+' → ':'')}${esc(f.path)}</li>`).join('');if(c.filesTruncated)$('#files').insertAdjacentHTML('beforeend','<li>Showing the first 200 changed files.</li>');if(!(c.files||[]).length)$('#files').innerHTML='<li>No file list (for example, a merge commit).</li>'}
function search(scroll=true){const q=$('#search').value.trim().toLowerCase();matches=[];document.querySelectorAll('.row').forEach((r,i)=>{const c=visible[i],match=Boolean(q)&&[c.subject,c.message,c.an,c.ae,c.hash,...c.refs.map(r=>r.name)].join(' ').toLowerCase().includes(q);r.classList.toggle('dimmed',Boolean(q)&&!match);r.classList.toggle('match',match);if(match)matches.push(i)});matchIndex=-1;$('#next').textContent=q?`${matches.length} matches · Next`:'Next';if(scroll&&matches.length)nextMatch()}
function scrollToRow(i){const row=document.querySelector(`.row[data-index="${i}"]`);if(row){$('#viewport').scrollTop=Math.max(0,i*30-60);row.focus({preventScroll:true})}}
function nextMatch(){if(!matches.length)return;matchIndex=(matchIndex+1)%matches.length;scrollToRow(matches[matchIndex])}
$('#repo').innerHTML=DATA.repos.map((r,i)=>`<option value="${i}">${esc(r.name)}</option>`).join('');$('#repo').onchange=chooseRepo;$('#branch').onchange=()=>{$('#detail').hidden=true;render()};$('#search').oninput=()=>search();$('#next').onclick=nextMatch;$('#search').onkeydown=e=>{if(e.key==='Enter')nextMatch()};$('#head').onclick=()=>{$('#branch').value='all';render();const i=visible.findIndex(c=>c.hash===repo.head);if(i>=0){pick(i);scrollToRow(i)}};$('#close').onclick=()=>{$('#detail').hidden=true};$('#updated').textContent='Updated: '+new Date(DATA.generated).toLocaleString('en-US');$('#updated').title='Follows the selected Orca workspace. Checks local Git changes every 10 seconds.';chooseRepo();
</script></body></html>
